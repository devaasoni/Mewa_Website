<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEBI Registration Certificate - The Mewa</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #222; /* Dark background looks professional */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cert-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        img {
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 0 20px rgba(0,0,0,0.5); /* Nice shadow effect */
            border-radius: 4px;
            object-fit: contain; /* Ensures the whole image is visible without scrolling */
        }
    </style>
</head>
<body>
    <div class="cert-container">
        <img src="sebi-registration.jpg" alt="SEBI Registration Certificate">
    </div>
</body>
</html>
